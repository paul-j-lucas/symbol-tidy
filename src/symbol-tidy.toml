[symbol-tidy]
ignore-paths = [
  "config.h"
]

[cli_options.c]
ignore-symbols = [
  "PUT_CONFIG_OPT"
]

[cli_options.h]
ignore-symbols = [
  "OPT_CONFIG",
  "OPT_COMPILER",
  "OPT_DIRECTORY",
  "OPT_DEBUG",
  "OPT_ERROR",
  "OPT_HELP",
  "OPT_COLOR",
  "OPT_NO_CONFIG_LAYERS",
  "OPT_VERSION",
  "OPT_VERBOSE",
]

[color.c]
ignore-symbols = [
  "SGR_BG_BLACK",
  "SGR_BG_BLUE",
  "SGR_BG_CYAN",
  "SGR_BG_GREEN",
  "SGR_BG_MAGENTA",
  "SGR_BG_RED",
  "SGR_BG_WHITE",
  "SGR_BG_YELLOW",
  "SGR_FG_BLACK",
  "SGR_FG_BLUE",
  "SGR_FG_CYAN",
  "SGR_FG_GREEN",
  "SGR_FG_MAGENTA",
  "SGR_FG_RED",
  "SGR_FG_WHITE",
  "SGR_FG_YELLOW",
]

[strbuf.c]
ignore-symbols = [
  "strbuf_sepsn_putsn"
]
[strbuf.h]
ignore-symbols = [
  "strbuf_sepsn_puts"
]

[util.h]
ignore-symbols = [
  "ARG_11",
  "ARGS_HAS_COMMA",
  "ARGS_IS_EMPTY",
  "ARGS_IS_EMPTY_CASES",
  "ARGS_IS_EMPTY_COMMA",
  "ARGS_IS_EMPTY_RESULT_0001",

  "CHARIFY_0",
  "CHARIFY_1",
  "CHARIFY_2",
  "CHARIFY_3",
  "CHARIFY_4",
  "CHARIFY_5",
  "CHARIFY_6",
  "CHARIFY_7",
  "CHARIFY_8",
  "CHARIFY_9",
  "CHARIFY_A",
  "CHARIFY_B",
  "CHARIFY_C",
  "CHARIFY_D",
  "CHARIFY_E",
  "CHARIFY_F",
  "CHARIFY_G",
  "CHARIFY_H",
  "CHARIFY_I",
  "CHARIFY_J",
  "CHARIFY_K",
